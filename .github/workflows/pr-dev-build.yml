name: PR dev build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-dev-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos-dev-build:
    runs-on: macos-latest
    # Keep Apple credential variables empty so forge.config.ts stays on its
    # ad-hoc identity ("-") path. Do not map signing secrets into this job.
    env:
      APPLE_ID: ""
      APPLE_PASSWORD: ""
      APPLE_TEAM_ID: ""
      APPLE_APP_SPECIFIC_PASSWORD: ""
      CSC_LINK: ""
      CSC_KEY_PASSWORD: ""
      CSC_NAME: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # This job never pushes or fetches after checkout. Do not leave the
          # job token in git config, where `bun run make` could read it.
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Refuse signing secrets
        run: |
          set -euo pipefail
          if [ -n "${APPLE_ID}${APPLE_PASSWORD}${APPLE_TEAM_ID}${APPLE_APP_SPECIFIC_PASSWORD}${CSC_LINK}${CSC_KEY_PASSWORD}${CSC_NAME}" ]; then
            echo "PR dev builds must not use Apple signing secrets."
            exit 1
          fi

      - name: Make unsigned distributables
        run: bun run make

      - name: Verify the app is ad-hoc signed
        run: |
          set -euo pipefail
          app="$(find out -type d -name 'Vaani.app' -print -quit)"
          if [ -z "${app}" ]; then
            echo "Packaged Vaani.app was not found."
            exit 1
          fi
          details="$(codesign -dv --verbose=4 "${app}" 2>&1 || true)"
          printf '%s\n' "${details}"
          if printf '%s\n' "${details}" | grep -q "Authority=Developer ID"; then
            echo "Refusing to upload a Developer ID signed build."
            exit 1
          fi
          if ! printf '%s\n' "${details}" | grep -q "Signature=adhoc"; then
            echo "Expected an ad-hoc signature so the app can launch on Apple Silicon without signing secrets."
            exit 1
          fi

      - name: Stage artifact
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Name the artifact from the PR head, which is the commit shown on the pull request.
            short_sha="$(printf '%.7s' "${{ github.event.pull_request.head.sha }}")"
            label="pr-${{ github.event.pull_request.number }}-${short_sha}"
          else
            short_sha="$(git rev-parse --short=7 HEAD)"
            label="${short_sha}"
          fi
          mkdir -p dist-artifact
          zip=""
          dmg=""
          while IFS= read -r file; do
            case "${file}" in
              *.blockmap) ;;
              *.zip) zip="${zip:-${file}}" ;;
              *.dmg) dmg="${dmg:-${file}}" ;;
            esac
          done < <(find out/make -type f)
          if [ -z "${zip}" ] || [ -z "${dmg}" ]; then
            echo "Expected a zip and a dmg under out/make."
            find out/make -print
            exit 1
          fi
          cp "${zip}" "dist-artifact/Vaani-macos-dev-${label}.zip"
          cp "${dmg}" "dist-artifact/Vaani-macos-dev-${label}.dmg"
          echo "artifact_name=vaani-macos-dev-${label}" >> "${GITHUB_OUTPUT}"
          ls -lh dist-artifact

      - name: Upload dev build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: dist-artifact/*
          if-no-files-found: error
          retention-days: 14

      - name: Summarize
        run: |
          {
            echo "### Unsigned macOS dev build"
            echo ""
            echo "Artifact: \`${{ steps.meta.outputs.artifact_name }}\` (kept for 14 days)."
            echo ""
            echo "Apple Silicon. No Developer ID signature and no notarization."
            echo "Unzip the artifact, then unzip \`Vaani-macos-dev-*.zip\` to get \`Vaani.app\`."
            echo "Gatekeeper will block the download until you right-click the app and choose Open, or run \`xattr -cr /path/to/Vaani.app\`."
          } >> "${GITHUB_STEP_SUMMARY}"
